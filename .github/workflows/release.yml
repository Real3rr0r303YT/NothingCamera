name: Release

# Push a tag like v1.0.0 → signed release APK + KernelSU module on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew

      # Optional: your own signing key from repository secrets (keeps updates installable).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=own release key" >> "$GITHUB_ENV"
          else
            echo "::warning::No NC_KEYSTORE_BASE64 secret – signing with the debug key."
            echo "SIGNING=debug key (no release key configured yet)" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace
      - name: Build release APK
        env:
          NC_KEYSTORE_PASSWORD: ${{ secrets.NC_KEYSTORE_PASSWORD }}
          NC_KEY_ALIAS: ${{ secrets.NC_KEY_ALIAS }}
          NC_KEY_PASSWORD: ${{ secrets.NC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Privacy check – no network or location permissions
        run: |
          MANIFEST=$(find app/build/intermediates -path '*release*' -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          [ -n "$MANIFEST" ] || { echo "::error::Merged manifest not found"; exit 1; }
          for p in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_MEDIA_LOCATION ACCESS_BACKGROUND_LOCATION READ_CONTACTS READ_PHONE_STATE; do
            if grep -q "android.permission.$p\"" "$MANIFEST"; then echo "::error::$p found"; exit 1; fi
          done

      - name: Package APK, KernelSU module and checksums
        run: |
          VERSION=${TAG#v}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NothingCamera-v$VERSION.apk"
          bash module/build.sh "dist/NothingCamera-v$VERSION.apk" app dist
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          CERT=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/NothingCamera-v$VERSION.apk" 2>/dev/null | grep -m1 'SHA-256 digest' | awk '{print $NF}' || true)
          echo "CERT=$CERT" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## NothingCamera $TAG

          Private, offline camera in Nothing style – system camera for **NoxisOS**.

          | File | What |
          |---|---|
          | \`NothingCamera-$TAG.apk\` | normal install, no root needed |
          | \`NothingCamera-$TAG-module.zip\` | **KernelSU** / Magisk / APatch module – installs as system camera so other apps can use it |
          | \`SHA256SUMS.txt\` | checksums – verify before installing |

          **Highlights:** photo · video (HD/FHD/4K, 30/60 fps) · night & portrait (if supported) · zoom up to 40× ·
          metadata always stripped · encrypted vault with biometric lock & panic wipe · no INTERNET, no location permission.

          🇩🇪 Deutsch: [README.de.md](https://github.com/Real3rr0r303YT/NothingCamera/blob/main/README.de.md) · 🇹🇷 Türkçe: [README.tr.md](https://github.com/Real3rr0r303YT/NothingCamera/blob/main/README.tr.md)

          Signed with: $SIGNING${CERT:+ – cert SHA-256 \`$CERT\`}

          ☕ Support: https://buymeacoffee.com/3rr0r303yt

          **Made by 3rr0r303YT on TikTok** · GPL-3.0
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt \
              --title "NothingCamera $TAG" --notes-file notes.md
          fi

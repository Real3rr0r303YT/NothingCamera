name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Uploads via the GitHub web UI (or ZIP extracts on Windows) drop the
      # executable bit, which makes ./gradlew fail with "Permission denied".
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Privacy check – no network or location permissions
        run: |
          MANIFEST=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged manifest not found"; exit 1
          fi
          echo "Checking $MANIFEST"
          FAIL=0
          for p in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_MEDIA_LOCATION ACCESS_BACKGROUND_LOCATION READ_CONTACTS READ_PHONE_STATE; do
            if grep -q "android.permission.$p\"" "$MANIFEST"; then
              echo "::error::Forbidden permission $p found in merged manifest"; FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] && echo "OK – no network, location or identity permissions."
          exit $FAIL

      - uses: actions/upload-artifact@v4
        with:
          name: nothingcamera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # System app install is what lets other apps open NothingCamera via
      # ACTION_IMAGE_CAPTURE / ACTION_VIDEO_CAPTURE on Android 11+.
      - name: Build root module (KernelSU / Magisk / APatch)
        run: bash module/build.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)" app dist
      - uses: actions/upload-artifact@v4
        with:
          name: nothingcamera-kernelsu-module
          path: dist/*-module.zip
          if-no-files-found: error
